name: PANIER OS - Asistan Mail Otomatik

on:
  schedule:
    # Sa ap kouri chak swa a 9:30 PM (21:30) nan Haiti (ki se 01:30 UTC)
    - cron: '30 1 * * *'
  workflow_dispatch: # Sa pèmèt ou kouri l alamen si w vle sou GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kòd la
      uses: actions/checkout@v4

    - name: Konfigire Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Enstale libreri yo
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kouri Asistan Mail la
      env:
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python asistan_mail.py
